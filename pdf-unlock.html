<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Unlocker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0c0c14;
  --surface:#14141f;
  --surface2:#1e1e2e;
  --border:#2c2c42;
  --accent:#7b68ff;
  --accent2:#ff6b9d;
  --accent3:#5ef0c0;
  --text:#e4e4f0;
  --muted:#5a5a78;
  --success:#3ddd8a;
  --error:#ff5577;
  --warn:#ffb547;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 15% 15%,rgba(123,104,255,.13) 0%,transparent 60%),
    radial-gradient(ellipse 45% 55% at 85% 80%,rgba(255,107,157,.09) 0%,transparent 60%),
    radial-gradient(ellipse 35% 50% at 65% 5%,rgba(94,240,192,.07) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

.wrap{position:relative;z-index:1;width:100%;max-width:520px}

/* ── Header ── */
.header{text-align:center;margin-bottom:2rem}
.brand{display:inline-flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.brand-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  box-shadow:0 0 28px rgba(123,104,255,.45);
}
.brand-name{
  font-size:1.5rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sub{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* ── Steps indicator ── */
.steps-bar{
  display:flex;align-items:center;justify-content:center;
  gap:0;margin-bottom:1.8rem;
}
.step-item{
  display:flex;flex-direction:column;align-items:center;gap:.35rem;
  flex:1;
}
.step-dot{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--border);
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;color:var(--muted);
  transition:all .35s ease;
  position:relative;z-index:1;
}
.step-label{
  font-family:'DM Mono',monospace;font-size:.65rem;
  color:var(--muted);transition:color .35s ease;
  text-align:center;letter-spacing:.04em;
}
.step-line{
  flex:1;height:2px;background:var(--border);
  margin:0 -1px;margin-bottom:1.1rem;
  transition:background .35s ease;
  position:relative;z-index:0;
}

/* step states */
.step-item.active .step-dot{
  border-color:var(--accent);
  background:rgba(123,104,255,.15);
  color:var(--accent);
  box-shadow:0 0 14px rgba(123,104,255,.4);
}
.step-item.active .step-label{color:var(--accent)}

.step-item.done .step-dot{
  border-color:var(--success);
  background:rgba(61,221,138,.15);
  color:var(--success);
}
.step-item.done .step-label{color:var(--success)}
.step-line.done{background:var(--success)}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:1.8rem;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}

/* ── Step panels ── */
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── Drop zone ── */
.drop-zone{
  border:2px dashed var(--border);
  border-radius:14px;padding:2.5rem 1.5rem;
  text-align:center;cursor:pointer;
  background:var(--surface2);
  transition:all .25s ease;
}
.drop-zone:hover,.drop-zone.over{
  border-color:var(--accent);
  background:rgba(123,104,255,.07);
  transform:scale(1.01);
}
.drop-zone .icon{font-size:2.6rem;display:block;margin-bottom:.7rem;transition:transform .3s ease}
.drop-zone:hover .icon,.drop-zone.over .icon{transform:translateY(-4px) scale(1.1)}
.drop-title{font-size:1rem;font-weight:700;margin-bottom:.3rem}
.drop-sub{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted)}
input[type=file]{display:none}

/* ── File chip ── */
.file-chip{
  display:flex;align-items:center;gap:.7rem;
  padding:.75rem 1rem;margin-top:1rem;
  background:rgba(94,240,192,.07);
  border:1px solid rgba(94,240,192,.22);
  border-radius:10px;
  animation:fadeUp .25s ease;
}
.file-chip .chip-name{
  font-family:'DM Mono',monospace;font-size:.8rem;
  color:var(--accent3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.file-chip .chip-size{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);flex-shrink:0}

/* ── Panel header ── */
.panel-title{font-size:1.05rem;font-weight:700;margin-bottom:.3rem}
.panel-desc{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.6}

/* ── Password ── */
.pw-row{position:relative;display:flex;align-items:center}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:.78rem 3rem .78rem 1rem;
  color:var(--text);
  font-family:'DM Mono',monospace;font-size:.95rem;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.pw-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(123,104,255,.15);
}
.pw-eye{
  position:absolute;right:.9rem;
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:1.05rem;
  transition:color .2s;line-height:1;padding:.2rem;
}
.pw-eye:hover{color:var(--text)}

/* ── Buttons ── */
.btn{
  width:100%;padding:.88rem;
  border:none;border-radius:12px;
  font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:all .25s ease;
  position:relative;overflow:hidden;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 4px 22px rgba(123,104,255,.35);
  margin-top:1.2rem;
}
.btn-primary::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12);opacity:0;transition:opacity .2s}
.btn-primary:hover:not(:disabled)::before{opacity:1}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(123,104,255,.45)}

.btn-success{
  background:rgba(61,221,138,.12);
  border:1.5px solid rgba(61,221,138,.35);
  color:var(--success);
  margin-top:.9rem;
}
.btn-success:hover{background:rgba(61,221,138,.2);transform:translateY(-2px)}

/* ── Progress bar ── */
.progress-wrap{margin-top:1.2rem}
.progress-label{
  display:flex;justify-content:space-between;
  font-family:'DM Mono',monospace;font-size:.72rem;
  color:var(--muted);margin-bottom:.5rem;
}
.progress-track{
  width:100%;height:6px;background:var(--surface2);
  border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent3));
  border-radius:99px;
  transition:width .3s ease;
  box-shadow:0 0 8px rgba(123,104,255,.5);
}

/* ── Status messages ── */
.msg{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.8rem 1rem;border-radius:10px;
  font-family:'DM Mono',monospace;font-size:.78rem;
  line-height:1.5;margin-top:1rem;
  animation:fadeUp .25s ease;
}
.msg.error{background:rgba(255,85,119,.08);border:1px solid rgba(255,85,119,.25);color:var(--error)}
.msg.info{background:rgba(123,104,255,.08);border:1px solid rgba(123,104,255,.2);color:var(--accent)}
.msg.warn{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.2);color:var(--warn)}

/* ── Success panel ── */
.success-icon{font-size:3rem;text-align:center;display:block;margin-bottom:.8rem;filter:drop-shadow(0 0 16px rgba(61,221,138,.5))}
.success-title{font-size:1.2rem;font-weight:800;text-align:center;color:var(--success);margin-bottom:.4rem}
.success-detail{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:.3rem}
.file-stats{
  display:flex;gap:.8rem;margin-top:1rem;
}
.stat-box{
  flex:1;padding:.75rem;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;text-align:center;
}
.stat-num{font-size:1.1rem;font-weight:800;color:var(--text);display:block}
.stat-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:.2rem;display:block}

/* ── Spinner ── */
.spinner{
  width:15px;height:15px;flex-shrink:0;
  border:2px solid rgba(123,104,255,.25);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin-top:.15rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Footer ── */
.footer{
  text-align:center;margin-top:1.5rem;
  font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);line-height:1.7;
}
.footer a{color:var(--accent3);text-decoration:none}

/* ── Reset link ── */
.reset-link{
  display:block;width:100%;text-align:center;
  background:none;border:none;
  font-family:'DM Mono',monospace;font-size:.75rem;
  color:var(--muted);cursor:pointer;
  text-decoration:underline;margin-top:.9rem;
  transition:color .2s;
}
.reset-link:hover{color:var(--text)}

/* hidden canvas for rendering */
#hiddenCanvas{display:none}
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🔓</div>
      <span class="brand-name">PDF Unlocker</span>
    </div>
    <p class="sub">browser-only · no uploads · instant</p>
  </div>

  <!-- Steps bar -->
  <div class="steps-bar">
    <div class="step-item active" id="si1">
      <div class="step-dot">1</div>
      <div class="step-label">Upload</div>
    </div>
    <div class="step-line" id="sl1"></div>
    <div class="step-item" id="si2">
      <div class="step-dot">2</div>
      <div class="step-label">Password</div>
    </div>
    <div class="step-line" id="sl2"></div>
    <div class="step-item" id="si3">
      <div class="step-dot">3</div>
      <div class="step-label">Download</div>
    </div>
  </div>

  <!-- Card -->
  <div class="card">

    <!-- Step 1: Upload -->
    <div class="panel active" id="panel1">
      <div class="drop-zone" id="dropZone">
        <span class="icon">📄</span>
        <p class="drop-title">Drop your PDF here</p>
        <p class="drop-sub">or click to browse</p>
      </div>
      <input type="file" id="fileInput" accept=".pdf">
      <div class="file-chip" id="fileChip" style="display:none">
        <span>📎</span>
        <span class="chip-name" id="chipName"></span>
        <span class="chip-size" id="chipSize"></span>
      </div>
    </div>

    <!-- Step 2: Password -->
    <div class="panel" id="panel2">
      <p class="panel-title">Enter the PDF password</p>
      <p class="panel-desc" id="panel2Desc">File: <span id="p2FileName" style="color:var(--accent3)"></span></p>
      <div class="pw-row">
        <input class="pw-input" type="password" id="pwInput" placeholder="Type password here…" autocomplete="off">
        <button class="pw-eye" id="pwEye" type="button">👁</button>
      </div>
      <div id="pwError" style="display:none"></div>
      <button class="btn btn-primary" id="unlockBtn">🔓 Unlock PDF</button>
      <div id="progressWrap" style="display:none">
        <div class="progress-wrap">
          <div class="progress-label"><span id="progressText">Processing…</span><span id="progressPct">0%</span></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
      <button class="reset-link" id="backBtn">← Choose a different file</button>
    </div>

    <!-- Step 3: Download -->
    <div class="panel" id="panel3">
      <span class="success-icon">✅</span>
      <p class="success-title">PDF Unlocked!</p>
      <p class="success-detail" id="successDetail"></p>
      <div class="file-stats">
        <div class="stat-box"><span class="stat-num" id="statPages">—</span><span class="stat-label">pages</span></div>
        <div class="stat-box"><span class="stat-num" id="statSize">—</span><span class="stat-label">file size</span></div>
      </div>
      <button class="btn btn-success" id="dlBtn">⬇ Download Unlocked PDF</button>
      <button class="reset-link" id="resetBtn">Unlock another file</button>
    </div>

  </div><!-- /card -->

  <p class="footer">
    🔒 Everything happens <strong style="color:var(--accent3)">in your browser</strong>.<br>
    Your file is never sent to any server.
  </p>

</div><!-- /wrap -->

<canvas id="hiddenCanvas"></canvas>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// Set pdf.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ─── state ─── */
let selFile = null;
let outBlob = null;
let outName = '';

/* ─── refs ─── */
const dropZone   = document.getElementById('dropZone');
const fileInput  = document.getElementById('fileInput');
const fileChip   = document.getElementById('fileChip');
const chipName   = document.getElementById('chipName');
const chipSize   = document.getElementById('chipSize');

const p2FileName = document.getElementById('p2FileName');
const pwInput    = document.getElementById('pwInput');
const pwEye      = document.getElementById('pwEye');
const pwError    = document.getElementById('pwError');
const unlockBtn  = document.getElementById('unlockBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressPct  = document.getElementById('progressPct');
const backBtn    = document.getElementById('backBtn');

const successDetail = document.getElementById('successDetail');
const statPages  = document.getElementById('statPages');
const statSize   = document.getElementById('statSize');
const dlBtn      = document.getElementById('dlBtn');
const resetBtn   = document.getElementById('resetBtn');

const canvas     = document.getElementById('hiddenCanvas');
const ctx        = canvas.getContext('2d');

/* ─── step navigation ─── */
function goStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById('panel'+i).classList.toggle('active', i===n);
    const si = document.getElementById('si'+i);
    si.classList.remove('active','done');
    if(i < n) si.classList.add('done');
    else if(i === n) si.classList.add('active');
    if(i < 3){
      const sl = document.getElementById('sl'+i);
      sl.classList.toggle('done', i < n);
    }
  });
  // update dot text for done steps to checkmark
  [1,2,3].forEach(i => {
    const dot = document.getElementById('si'+i).querySelector('.step-dot');
    const si  = document.getElementById('si'+i);
    dot.textContent = si.classList.contains('done') ? '✓' : i;
  });
}

/* ─── drop / file select ─── */
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if(f && f.name.toLowerCase().endsWith('.pdf')) pickFile(f);
  else showDropError('Please drop a valid .pdf file.');
});
fileInput.addEventListener('change', () => { if(fileInput.files[0]) pickFile(fileInput.files[0]); });

function pickFile(f) {
  selFile = f;
  chipName.textContent = f.name;
  chipSize.textContent = fmtSize(f.size);
  fileChip.style.display = 'flex';
  // Auto-advance after brief delay
  setTimeout(() => {
    p2FileName.textContent = f.name;
    goStep(2);
    setTimeout(() => pwInput.focus(), 150);
  }, 400);
}

function showDropError(msg) {
  // show inline in panel1
  let el = document.getElementById('dropErr');
  if(!el){ el = document.createElement('div'); el.id='dropErr'; el.className='msg error'; el.style.marginTop='0.8rem'; dropZone.parentNode.appendChild(el); }
  el.innerHTML = '❌ '+msg; el.style.display='flex';
}

/* ─── password eye ─── */
pwEye.addEventListener('click', () => {
  if(pwInput.type==='password'){ pwInput.type='text'; pwEye.textContent='🙈'; }
  else { pwInput.type='password'; pwEye.textContent='👁'; }
});

pwInput.addEventListener('keydown', e => { if(e.key==='Enter') unlockBtn.click(); });

/* ─── back button ─── */
backBtn.addEventListener('click', () => {
  clearPwUI();
  goStep(1);
});

/* ─── UNLOCK ─── */
unlockBtn.addEventListener('click', async () => {
  const pw = pwInput.value;  // allow empty string for unencrypted check
  clearPwUI();
  setProcessing(true);

  try {
    const ab = await selFile.arrayBuffer();

    // Load with PDF.js — this handles decryption
    let pdfDoc;
    try {
      pdfDoc = await pdfjsLib.getDocument({ data: ab, password: pw }).promise;
    } catch(err) {
      setProcessing(false);
      const e = err.name || err.message || '';
      if(e.includes('PasswordException') || e === 'PasswordException' ||
         (err.code !== undefined) ) {
        // pdf.js throws PasswordException with code 1 (need pw) or 2 (wrong pw)
        if(err.code === 1) showPwErr('This PDF requires a password.');
        else showPwErr('❌ Wrong password — please try again.');
      } else {
        showPwErr('Could not open PDF: ' + (err.message || err));
      }
      return;
    }

    const totalPages = pdfDoc.numPages;
    statPages.textContent = totalPages;

    // Render each page to canvas, collect as image
    const { jsPDF } = window.jspdf;
    let pdf = null;
    const SCALE = 2.0; // retina quality

    for(let i = 1; i <= totalPages; i++) {
      const pct = Math.round(((i-1)/totalPages)*90);
      setProgress(`Rendering page ${i} of ${totalPages}…`, pct);

      const page = await pdfDoc.getPage(i);
      const vp   = page.getViewport({ scale: SCALE });
      canvas.width  = vp.width;
      canvas.height = vp.height;

      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      // width/height in pts (72dpi base)
      const wPt = vp.width  / SCALE * 0.75;
      const hPt = vp.height / SCALE * 0.75;

      if(i === 1) {
        pdf = new jsPDF({ orientation: wPt > hPt ? 'l' : 'p', unit: 'pt', format: [wPt, hPt] });
      } else {
        pdf.addPage([wPt, hPt], wPt > hPt ? 'l' : 'p');
      }
      pdf.addImage(imgData, 'JPEG', 0, 0, wPt, hPt, undefined, 'FAST');
    }

    setProgress('Saving…', 95);
    const pdfBytes = pdf.output('arraybuffer');
    outBlob = new Blob([pdfBytes], { type:'application/pdf' });
    outName = selFile.name.replace(/\.pdf$/i,'') + '_unlocked.pdf';

    setProgress('Done!', 100);
    setProcessing(false);

    const sizeTxt = fmtSize(outBlob.size);
    statSize.textContent = sizeTxt;
    successDetail.textContent = `Saved as "${outName}"`;
    goStep(3);

  } catch(err) {
    setProcessing(false);
    showPwErr('Unexpected error: ' + (err.message || err));
  }
});

/* ─── download ─── */
dlBtn.addEventListener('click', () => {
  if(!outBlob) return;
  const url = URL.createObjectURL(outBlob);
  const a = document.createElement('a');
  a.href = url; a.download = outName; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
});

/* ─── reset ─── */
resetBtn.addEventListener('click', fullReset);

function fullReset() {
  selFile = null; outBlob = null; outName = '';
  fileInput.value = '';
  fileChip.style.display = 'none';
  chipName.textContent = ''; chipSize.textContent = '';
  clearPwUI();
  const de = document.getElementById('dropErr');
  if(de) de.style.display = 'none';
  goStep(1);
}

/* ─── helpers ─── */
function clearPwUI() {
  pwError.style.display = 'none';
  progressWrap.style.display = 'none';
  progressFill.style.width = '0%';
}

function showPwErr(msg) {
  pwError.className = 'msg error';
  pwError.innerHTML = '<span>❌</span><span>'+msg+'</span>';
  pwError.style.display = 'flex';
}

function setProcessing(on) {
  unlockBtn.disabled = on;
  if(on) {
    progressWrap.style.display = 'block';
  }
}

function setProgress(text, pct) {
  progressText.textContent = text;
  progressPct.textContent  = pct + '%';
  progressFill.style.width = pct + '%';
}

function fmtSize(b) {
  if(b < 1024) return b+' B';
  if(b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
</script>
</body>
</html>
